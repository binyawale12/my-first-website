<!DOCTYPE html>
<html>

<head>
    <title>My First Website</title>

    <style>
     
    body {
        background-color: lightblue;
        padding: 20px;
        text-align: center;
        display: flex;
        justify-content: center;
    }

    h1 {
        color: darkblue;
        font-size: 40px;
    }
  p {
        color: green;
        font-size: 20px;
    }
h2 {
    color: purple;
    font-size: 30px;
}

img {
    width: 300px;
    max-width: 100%;
    border-radius: 15px;
    border: 3px solid darkblue;
    align-self: center;
}
a {
    color: white;
    background-color: darkblue;
    font-size: 20px;
    padding: 10px 20px;
    border-radius: 8px;
    align-self: center;

}
a:hover {
    background-color: purple;
}
.card {
    background-color: white;
    padding: 30px;
    border-radius: 15px;
    box-shadow: 0 4px 10px gray;
    width: 90%;
    max-width: 500px;
    margin: 30px auto;

    display: flex;
    flex-direction: column;
    gap: 15px;
}
nav {
    background-color: darkblue;
    padding: 15px;
    margin-bottom: 20px;
    display: flex;
    justify-content: center;
    position: sticky;
    top: 0;
}

nav a {
    color: white;
    background-color: transparent;
    padding: 10px;
    margin: 0 10px;
    font-size: 18px;
}
nav a:hover {
    background-color: purple;
    border-radius: 5px;
}
footer {
    background-color: darkblue;
    color: white;
    padding: 15px;
    text-align: center;
    margin-top: 20px;
    border-radius: 8px;
}
footer p {
    color: white;
}													
    </style>
</head>

<body>
    
  <nav>
       <a href="#">Home</a>
       <a href="#">About</a>
       <a href="#">Contact</a>
  </nav>
   
  <div class="card">

    <h1>Welcome to My Website</h1>

    <h2>About Me</h2>

    <p>My name is ABDULMALIK.</p>

    <p>I am learning web development.</p>

    <a href="https://www.google.com">Visit Google</a>

    <img src="https://picsum.photos/300" alt="A sample image">
  
</div>
<footer>
    <p>© 2026 ABDULMALIK. All rights reserved.</p>
</footer>
  

</body>

</html>
